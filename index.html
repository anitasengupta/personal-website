<!DOCTYPE html>
<html lang="en-US">

  			function gtag(){dataLayer.push(arguments);}
  			gtag('js', new Date());

 			gtag('config', 'UA-60485576-2');
		</script>

		<!-- standard header info -->
		<meta charset="utf-8">
		<title>Anita Sengupta</title>
		<meta name="description" content="Anita Sengupta is a designer, artist, and writer based in Berlin.">
  		<meta name="viewport" content="width=device-width, initial-scale=1">

  		<!-- styling & interaction -->
  		<link rel="stylesheet" type="text/css" href="styles.css">

  		<!-- favicon, social previews -->
		<meta property="og:image" content="metadata/social-share-image.png"/>
		<link rel="icon" href="metadata/favicon.png"/>

	</head>
	<body>
		<div id="bg-placeholder"></div>
		<video autoplay muted loop playsinline id="bg-video" poster="sky-poster.webp">
  			<source src="sky.mp4" type="video/mp4">
		</video>
		<div id="bg-overlay"></div>
		<div id="content">
			<p>Anita Sengupta is a designer, artist, and writer based in Berlin.</p>
			<p id="contact"><a href="mailto:anita.m.sengupta@gmail.com">email</a> / <a href="https://anita-sengupta.com/portfolio" target="_blank">portfolio</a> / <a href="https://www.instagram.com/_thelaundromat/" target="_blank">instagram</a></p>
		</div>
		<script>
  			const video = document.getElementById('bg-video');
 			const overlay = document.getElementById('bg-overlay');
  			video.addEventListener('canplay', () => {
   			video.classList.add('loaded');
    		overlay.classList.add('loaded');
  			});
		</script>
	</body>
